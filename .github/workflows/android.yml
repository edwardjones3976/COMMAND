name: android

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (Android modules and pure-Kotlin modules) and lint
        run: ./gradlew --no-daemon testDebugUnitTest :domain:test :testing-jvm:test lint
      - name: Receipt scripts (redaction and permissions list) and the reliability harness parses
        working-directory: .
        run: |
          python3 -m unittest discover -s scripts/tests -v
          bash -n scripts/reliability.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-reports
          path: |
            android/**/build/reports/tests
            android/**/build/reports/lint-results-*.html
          if-no-files-found: ignore

  publication-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Publication-safety scanner (git-tracked files)
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests com.command.PublicationSafetyTest

  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The phone signing identity (amendment 39): when the repository holds the keystore as a secret, every APK here is signed with it, so a
      # later build installs over an earlier one on the owner's phone. Without the secret nothing changes: a throwaway debug key and an unsigned
      # release. The keystore is written outside the checkout and never uploaded.
      - name: Phone signing identity, if the repository has one
        env:
          KEYSTORE_B64: ${{ secrets.COMMAND_SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/phone.jks"
            echo "COMMAND_SIGNING_KEYSTORE=$RUNNER_TEMP/phone.jks" >> "$GITHUB_ENV"
            echo "Signed with the phone identity." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No phone signing identity in this repository: the debug APK is signed with this runner's throwaway key and cannot update one built elsewhere." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Assemble debug, noexact and release APKs
        env:
          COMMAND_SIGNING_STORE_PASSWORD: ${{ secrets.COMMAND_SIGNING_STORE_PASSWORD }}
          COMMAND_SIGNING_KEY_ALIAS: ${{ secrets.COMMAND_SIGNING_KEY_ALIAS }}
          COMMAND_SIGNING_KEY_PASSWORD: ${{ secrets.COMMAND_SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease assembleNoexact
      - name: The release receipt lists exactly the permissions of the merged release manifest
        run: |
          manifest="$(find app/build/intermediates/merged_manifest/release -name AndroidManifest.xml | head -1)"
          test -n "$manifest"
          python3 ../scripts/receipt-permissions.py check ../docs/RELEASE-RECEIPT.html "$manifest"
          { echo "### Permissions of the merged release manifest"; echo '```'; python3 ../scripts/receipt-permissions.py list "$manifest"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Record APK digests
        run: |
          {
            echo "### APK SHA-256"
            echo '```'
            sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk
            echo '```'
            echo "### Signing certificate of the debug APK"
            echo '```'
            "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs app/build/outputs/apk/debug/*.apk | grep -E 'SHA-256 digest|DN:' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
